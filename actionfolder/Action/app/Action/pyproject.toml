
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "action"
version = "0.1.0"
description = "LangGraph Action Agent on Amazon Bedrock AgentCore"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "bedrock-agentcore[a2a] ~= 1.24.0",
    "a2a-sdk[all] ~= 0.3.26",
    "aws-opentelemetry-distro ~= 0.21.0",
    "opentelemetry-instrumentation-langchain ~= 0.62.3",
    "langchain ~= 1.4.0",
    "langchain-aws ~= 1.7.5",
    "langgraph ~= 1.2.11",
    "botocore[crt] >= 1.35.0",
    "python-dotenv",
    "mcp>=2.3.0",
    "httpx>=0.28.1",
]

[tool.hatch.build.targets.wheel]
packages = ["."]
