[project]
name = "p3-coordinator-runtime"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "p3-agentcore-assistant",
    "aws-opentelemetry-distro",
    "opentelemetry-instrumentation-langchain",
]

[tool.uv.sources]
# `agentcore deploy` installs wheels only (--only-binary :all:), so it cannot build assistant/
# from source. Build the wheel first, from assistant/: `uv build --wheel` (dist/ is gitignored).
# Rebuild before every deploy, or the runtime ships the code from the last build.
p3-agentcore-assistant = { path = "../../../dist/p3_agentcore_assistant-0.1.0-py3-none-any.whl" }
